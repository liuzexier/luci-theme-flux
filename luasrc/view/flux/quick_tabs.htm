<div class="cbi-section flux-quick-settings" data-flux-quick-settings>
  <h3><%:底部快捷入口%></h3>

  <div class="flux-quick-slot-switch" role="tablist" aria-label="<%:快捷入口位置%>">
    <button type="button" class="is-active" role="tab" aria-selected="true" data-flux-slot-button="slot1">
      Tab1
    </button>
    <button type="button" role="tab" aria-selected="false" data-flux-slot-button="slot2">
      Tab2
    </button>
    <button type="button" role="tab" aria-selected="false" data-flux-slot-button="slot3">
      Tab3
    </button>
  </div>

  <div class="flux-quick-panels" data-flux-quick-panels></div>

  <div class="flux-quick-preview">
    <div class="flux-quick-preview-title"><%:预览%></div>
    <div class="flux-quick-preview-nav">
      <div class="flux-bottom-item" data-flux-preview-slot="slot1">
        <div class="flux-bottom-link" data-icon="home">
          <span class="flux-bottom-icon"></span>
          <span class="flux-bottom-label">Home</span>
        </div>
      </div>
      <div class="flux-bottom-item" data-flux-preview-slot="slot2">
        <div class="flux-bottom-link" data-icon="services">
          <span class="flux-bottom-icon"></span>
          <span class="flux-bottom-label"><%:服务%></span>
        </div>
      </div>
      <div class="flux-bottom-item" data-flux-preview-slot="slot3">
        <div class="flux-bottom-link" data-icon="network">
          <span class="flux-bottom-icon"></span>
          <span class="flux-bottom-label"><%:网络%></span>
        </div>
      </div>
      <div class="flux-bottom-item">
        <div class="flux-bottom-link" data-icon="all">
          <span class="flux-bottom-icon"></span>
          <span class="flux-bottom-label"><%:全部%></span>
        </div>
      </div>
    </div>
  </div>

  <div hidden data-flux-branch-paths>
    <% for _, path in ipairs(self.branch_paths or {}) do -%>
      <span data-flux-branch-path="<%=pcdata(path)%>"></span>
    <% end -%>
  </div>
</div>
